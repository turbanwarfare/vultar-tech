name = "game-api"
main = "src/entry.py"
compatibility_date = "2025-10-01"
compatibility_flags = ["python_workers"]
workers_dev = false

routes = [
  { pattern = "api.example.com", custom_domain = true }
]

[triggers]
crons = ["*/15 * * * *", "0 12 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "game-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[ratelimits]]
name = "GAME_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60
